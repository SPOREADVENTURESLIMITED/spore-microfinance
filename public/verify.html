<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09251f"><title>Verify document | Spore Microfinance"><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f8f4;color:#102b25;margin:0;padding:24px}.card{max-width:620px;margin:8vh auto;background:white;border:1px solid #dce7df;border-radius:18px;padding:26px}h1{margin-top:0}.muted{color:#65776f}.status{padding:12px;border-radius:10px;background:#e9f7eb;color:#155b37}.bad{background:#fff0ed;color:#9b3024}a{color:#087a55}</style></head><body><main class="card"><h1>Spore Microfinance</h1><h2>Document verification</h2><p class="muted">Checking the document reference against the official system…</p><div id="result" class="status">Verifying…</div><p><a href="/account.html">Return to customer portal</a></p></main><script>
(async()=>{const q=new URLSearchParams(location.search),type=q.get('type'),id=q.get('id'),box=document.getElementById('result');if(!['loan','schedule','payment'].includes(type)||!/^\\d+$/.test(id||'')){box.className='status bad';box.textContent='Invalid document reference.';return}try{const r=await fetch('/api/verify/'+type+'/'+id,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.verified)throw Error(d.error||'Document not found.');const x=d.document;box.innerHTML='<b>Verified record</b><br>Reference: '+x.reference+'<br>Document: '+x.type+'<br>Status: '+x.status+'<br>Loan application: #'+x.applicationId+(x.amount!==undefined?'<br>Amount: UGX '+Number(x.amount).toLocaleString('en-UG'):'')+(x.totalPayable!==undefined?'<br>Total payable: UGX '+Number(x.totalPayable).toLocaleString('en-UG'):'')+(x.dueDate?'<br>Due date: '+x.dueDate:'')+(x.paidAt?'<br>Date recorded: '+x.paidAt:'')+(x.settlementNotice?'<p>'+x.settlementNotice+'</p>':'')}catch(e){box.className='status bad';box.textContent=e.message}})();
</script></body></html>
