name: Deploy Spore Microfinance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Validate Worker and portal JavaScript
        run: |
          node --check src/worker.js
          node --check scripts/check-portal.js
          node scripts/check-portal.js

      - name: Apply D1 migrations
        run: wrangler d1 migrations apply spore-microfinance-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
